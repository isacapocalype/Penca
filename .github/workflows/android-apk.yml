name: Android APK

# Builds an installable Android APK on every push to main, every v* tag, and
# manually. Production releases must provide the persistent signing key through
# repository secrets; without them the workflow builds with a throwaway CI key
# so pull requests and forks can still verify the build.
#
# Required secrets for a Play-ready release:
#   ANDROID_KEYSTORE_BASE64      base64 of the .keystore file
#   ANDROID_KEYSTORE_PASSWORD    keystore password
#   ANDROID_KEY_ALIAS            key alias
#   ANDROID_KEY_PASSWORD         key password

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/penca-release.keystore"

          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            echo "Using the release keystore from repository secrets."
            {
              echo "PENCA_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
              echo "PENCA_KEY_ALIAS=$ANDROID_KEY_ALIAS"
              echo "PENCA_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            keytool -genkeypair \
              -keystore "$keystore" \
              -alias penca-ci \
              -keyalg RSA \
              -keysize 2048 \
              -validity 3650 \
              -storepass penca-ci-only \
              -keypass penca-ci-only \
              -dname "CN=Penca CI, OU=Mobile, O=Penca, L=Jakarta, C=ID"

            echo "::warning::No release keystore configured. The APK is signed with a throwaway CI key and cannot be upgraded over a production install."
            echo "PENCA_KEYSTORE_PASSWORD=penca-ci-only" >> "$GITHUB_ENV"
            echo "PENCA_KEY_ALIAS=penca-ci" >> "$GITHUB_ENV"
            echo "PENCA_KEY_PASSWORD=penca-ci-only" >> "$GITHUB_ENV"
          fi

          echo "PENCA_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify offline manifest
        run: |
          apk="$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"

          if [ -z "$apk" ]; then
            echo "::error::No APK was produced."
            exit 1
          fi

          sdk_root="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          aapt2_bin="${sdk_root}/build-tools/36.0.0/aapt2"

          if [ ! -x "$aapt2_bin" ]; then
            echo "::error::aapt2 was not found."
            exit 1
          fi

          permissions="$("$aapt2_bin" dump permissions "$apk")"
          echo "$permissions"

          if grep -q 'android.permission.INTERNET' <<< "$permissions"; then
            echo "::error::APK requests INTERNET. Penca must remain fully offline."
            exit 1
          fi

      - name: Verify APK artifact
        run: |
          apk="$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"

          if [ -z "$apk" ]; then
            echo "::error::No APK was produced."
            find android/app/build/outputs -type f || true
            exit 1
          fi

          size="$(stat -c%s "$apk")"

          if [ "$size" -lt 1000000 ]; then
            echo "::error::APK is suspiciously small ($size bytes)."
            exit 1
          fi

          sdk_root="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          apksigner_bin="${sdk_root}/build-tools/36.0.0/apksigner"

          if [ ! -x "$apksigner_bin" ]; then
            apksigner_bin="$(command -v apksigner || true)"
          fi

          if [ -z "$apksigner_bin" ] || [ ! -x "$apksigner_bin" ]; then
            echo "::error::apksigner was not found."
            exit 1
          fi

          "$apksigner_bin" verify --print-certs "$apk"
          sha256sum "$apk" | tee android/app/build/outputs/apk/release/SHA256SUMS.txt
          echo "APK: $apk ($size bytes)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: penca-android-apk-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
